name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Demo mode (simulated catalogue)
        - Live Qloo
        - Not applicable
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or deployment
      description: The commit hash, or the hosted demo and the time you used it.
  - type: textarea
    id: logs
    attributes:
      label: Output
      description: Console or server output. Remove any key or token before pasting.
      render: text
