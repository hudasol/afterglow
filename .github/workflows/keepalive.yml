# Keeps the free hosted demo awake while it is being judged. A free Render instance sleeps after
# fifteen minutes without traffic and takes about a minute to wake, which would greet a visitor with
# a blank page. Outside the window below this job does nothing.
name: Keepalive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the hosted demo inside the judging window
        run: |
          now=$(date -u +%s)
          start=$(date -u -d '2026-10-29 12:00:00' +%s)
          end=$(date -u -d '2026-11-06 00:00:00' +%s)
          if [ "$now" -lt "$start" ] || [ "$now" -ge "$end" ]; then
            echo "Outside the judging window. Nothing to do."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 90 --retry 2 \
            https://afterglow-gsc4.onrender.com/api/health
