# Runs the live Qloo evaluation from GitHub, so the personal key never has to leave GitHub.
# It runs only when started by hand. The key comes from the repository secret QLOO_API_KEY.
name: Live evaluation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: preflight only resolves the scenario inputs and ranks nothing. diagnose prints why scenarios came out as they did and writes nothing. timing sends one ranking request in several forms and prints how long each takes. run is the preregistered evaluation. second-run repeats it after fixes and writes separate files. explore ranks the same pool with other forms of each plan's signals, prints the comparison and writes nothing. preflight-test resolves the inputs of the test scenarios and ranks nothing. baselines-dev and baselines-test rank a scenario set against the baselines and print the results file. categories shows how each venue category resolves and how many places its tag returns in three cities.
        type: choice
        options:
          - preflight
          - diagnose
          - timing
          - run
          - second-run
          - explore
          - preflight-test
          - baselines-dev
          - baselines-test
          - categories
        default: preflight

permissions:
  contents: read

jobs:
  evaluate:
    name: Live evaluation on Qloo
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      QLOO_API_KEY: ${{ secrets.QLOO_API_KEY }}
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check that the secret is set
        run: |
          if [ -z "$QLOO_API_KEY" ]; then
            echo "The repository secret QLOO_API_KEY is not set. Nothing was requested."
            exit 2
          fi
      - name: Resolve the scenario inputs
        if: ${{ inputs.mode == 'preflight' }}
        run: npm run eval:preflight
      - name: Explain how each scenario came out
        if: ${{ inputs.mode == 'diagnose' }}
        run: npm run eval -- --diagnose evaluation/live-scenarios.json
      - name: Time the forms of one ranking request
        if: ${{ inputs.mode == 'timing' }}
        run: |
          npm run qloo:timing -- ny-b-saturday-vegetarian --cumulative
          npm run qloo:timing -- ny-d-wednesday-group --cumulative
          npm run qloo:timing -- ny-a-friday-anniversary --cumulative
      - name: Compare other forms of the signals
        if: ${{ inputs.mode == 'explore' }}
        run: npm run qloo:explore -- evaluation/live-scenarios.json
      - name: Resolve the inputs of the test scenarios
        if: ${{ inputs.mode == 'preflight-test' }}
        run: npm run eval -- --preflight evaluation/test-scenarios.json
      - name: Check how each venue category resolves
        if: ${{ inputs.mode == 'categories' }}
        run: |
          npm run qloo:categories -- Chicago Berlin Dubai
          npm run qloo:categories -- --phrases "dessert shop,bakery,ice cream,patisserie,sweets,live music venue,jazz club,music venue,concert hall" Chicago Berlin Dubai
      - name: Rank the development scenarios against the baselines
        if: ${{ inputs.mode == 'baselines-dev' }}
        run: npm run eval:baselines -- --run dev
      - name: Rank the test scenarios against the baselines
        if: ${{ inputs.mode == 'baselines-test' }}
        run: npm run eval:baselines -- --run test
      - name: Run the preregistered evaluation
        if: ${{ inputs.mode == 'run' }}
        run: npm run eval:live
      - name: Run the evaluation again after the fixes
        if: ${{ inputs.mode == 'second-run' }}
        run: npm run eval:live -- --second-run
      - name: Print the results file
        if: ${{ inputs.mode == 'run' && always() }}
        run: |
          echo "-----BEGIN RESULTS-----"
          cat results/live-qloo.json 2>/dev/null || echo "No results were written."
          echo "-----END RESULTS-----"
      - name: Print the results file of the second run
        if: ${{ inputs.mode == 'second-run' && always() }}
        run: |
          echo "-----BEGIN RESULTS-----"
          cat results/live-qloo-second-run.json 2>/dev/null || echo "No results were written."
          echo "-----END RESULTS-----"
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.mode == 'run' && always() }}
        with:
          name: live-evaluation-results
          path: results/live-qloo.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: ${{ startsWith(inputs.mode, 'baselines') && always() }}
        with:
          name: baseline-results
          path: results/baselines-*.json
          if-no-files-found: ignore
