# Checks the OpenStreetMap place facts reader against real data. It needs no secret.
# It runs only when started by hand.
name: OpenStreetMap smoke test

on:
  workflow_dispatch:
    inputs:
      lat:
        description: Latitude of a public point
        default: '40.7580'
      lon:
        description: Longitude of a public point
        default: '-73.9855'
      radius:
        description: Radius in metres, 50 to 1500
        default: '400'
      points:
        description: Number of points to ask about at once, 1 to 40
        default: '1'
      overpass_url:
        description: Overpass endpoint, or several separated by commas
        default: https://overpass-api.de/api/interpreter,https://overpass.kumi.systems/api/interpreter
      timeout_ms:
        description: How long to wait for an answer, in milliseconds
        default: '45000'

permissions:
  contents: read

jobs:
  smoke:
    name: Real data check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LAT: ${{ inputs.lat }}
      LON: ${{ inputs.lon }}
      RADIUS: ${{ inputs.radius }}
      POINTS: ${{ inputs.points }}
      OVERPASS_URL: ${{ inputs.overpass_url }}
      OVERPASS_TIMEOUT_MS: ${{ inputs.timeout_ms }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Time a few raw queries against each endpoint
        continue-on-error: true
        run: |
          for url in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter; do
            echo "== $url"
            curl -sS -m 25 -o /dev/null -w "status page: %{http_code} in %{time_total}s\n" "${url%/interpreter}/status" || echo "status page: failed"
            curl -sS -m 25 -o /dev/null -w "one node filter: %{http_code} in %{time_total}s, %{size_download} bytes\n" \
              --data-urlencode 'data=[out:json][timeout:10];node(around:100,40.758,-73.9855)["amenity"="restaurant"];out tags 5;' "$url" || echo "one node filter: failed"
            curl -sS -m 25 -o /dev/null -w "regex on amenity, 150 m: %{http_code} in %{time_total}s, %{size_download} bytes\n" \
              --data-urlencode 'data=[out:json][timeout:20];nwr(around:150,40.758,-73.9855)["name"]["amenity"~"^(restaurant|bar|pub|cafe)$"];out tags center 100;' "$url" || echo "regex: failed"
            curl -sS -m 25 -o /dev/null -w "exact values, 150 m: %{http_code} in %{time_total}s, %{size_download} bytes\n" \
              --data-urlencode 'data=[out:json][timeout:20];(nwr["amenity"="restaurant"](around:150,40.758,-73.9855);nwr["amenity"="bar"](around:150,40.758,-73.9855);nwr["amenity"="pub"](around:150,40.758,-73.9855);nwr["amenity"="cafe"](around:150,40.758,-73.9855););out tags center 100;' "$url" || echo "exact: failed"
          done
      - name: Run the check
        run: npm run osm:smoke -- --lat "$LAT" --lon "$LON" --radius "$RADIUS" --points "$POINTS"
      - name: Show the redacted report
        if: always()
        run: cat data/evaluation/osm-smoke-*.json 2>/dev/null || echo "No report was written."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osm-smoke-report
          path: data/evaluation/osm-smoke-*.json
          if-no-files-found: ignore
